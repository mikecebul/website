name: CI

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify SQLite schema, authentication and submissions
        env:
          NODE_ENV: production
          DATABASE_URI: file:/tmp/website-sqlite-fixture-ci.db
          PAYLOAD_SECRET: isolated-ci-fixture-secret
          S3_ENABLED: 'false'
          RESEND_API_KEY: local-test-only
        run: pnpm test:database

      - name: Build production server
        run: pnpm build
